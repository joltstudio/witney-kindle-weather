name: Publish Witney weather

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - PROJECT.md
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: true
      - name: Fetch and validate latest forecast
        run: node scripts/fetch-weather.mjs
      - name: Serve and render the 600×800 screen
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_NO_SANDBOX: '1'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/weather-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/render.mjs --snapshot
      - name: Assemble Pages site
        run: |
          mkdir -p site/assets site/outputs
          cp index.html app.js weather.js config.js styles.css kindle.html site/
          cp -R assets/fonts site/assets/
          cp outputs/witney-weather-live-600x800.png site/outputs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
