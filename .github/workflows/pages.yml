name: Publish Witney weather

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - PROJECT.md
  schedule:
    # Five-minute test cadence, offset from the top of the hour. GitHub may
    # delay or drop scheduled events; a cron entry is not a delivery guarantee.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          # GitHub-hosted Ubuntu runners already include Chrome's runtime
          # libraries. Installing them again runs apt-get update, which has
          # intermittently hung or failed against the runner's package mirrors.
          install-dependencies: false
      - uses: actions/cache/restore@v4
        with:
          path: outputs/weather-snapshot.json
          key: weather-snapshot-${{ github.run_id }}
          restore-keys: weather-snapshot-
      - name: Check whether a scheduled forecast refresh is due
        id: refresh
        run: node scripts/refresh-policy.mjs
      - name: Fetch and validate latest forecast
        id: forecast
        if: steps.refresh.outputs.due == 'true'
        continue-on-error: true
        run: node scripts/fetch-weather.mjs
      - uses: actions/cache/save@v4
        if: steps.forecast.outcome == 'success'
        with:
          path: outputs/weather-snapshot.json
          key: weather-snapshot-${{ github.run_id }}
      - name: Serve and render the 600×800 screen
        if: steps.forecast.outcome == 'success' || steps.forecast.outcome == 'skipped'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_NO_SANDBOX: "1"
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/weather-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/render.mjs --snapshot
      - name: Keep the last published image if forecast fetch fails
        if: steps.forecast.outcome == 'failure'
        run: |
          mkdir -p outputs
          curl --fail --silent --show-error --location --max-time 30 \
            https://joltstudio.github.io/witney-kindle-weather/outputs/witney-weather-live-600x800.png \
            --output outputs/witney-weather-live-600x800.png
      - name: Assemble Pages site
        run: |
          mkdir -p site/assets site/outputs
          cp index.html app.js weather.js config.js observations.js styles.css kindle.html site/
          cp -R assets/fonts site/assets/
          cp outputs/witney-weather-live-600x800.png site/outputs/
          if [ -f outputs/weather-snapshot.json ]; then cp outputs/weather-snapshot.json site/outputs/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
